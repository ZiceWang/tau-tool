name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
          - os: windows
            arch: arm64
            ext: .exe
          - os: linux
            arch: amd64
            ext: ''
          - os: linux
            arch: arm64
            ext: ''
          - os: darwin
            arch: amd64
            ext: ''
          - os: darwin
            arch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X tau-tool/internal/server.Version=${{ github.ref_name }}" \
            -o "dist/tau-tool-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" ./cmd/server

      - uses: actions/upload-artifact@v4
        with:
          name: tau-tool-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble
        run: |
          mkdir -p assets
          find dist -type f -name 'tau-tool-*' -exec cp {} assets/ \;
          ls -la assets/

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
